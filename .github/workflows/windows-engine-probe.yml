# Temporary probe for the Windows engine build. Never merged.
name: windows-engine-probe
on:
  push:
    branches: [claude/project-thread-ejf7gk-winprobe]
permissions:
  contents: read
jobs:
  engine:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: .xsec-binary-analysis-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: base-devel git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python
      - name: Build the Windows engine bundle
        shell: msys2 {0}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          temp_root="$(cygpath -u "$RUNNER_TEMP")"
          python .xsec-binary-analysis-source/scripts/build_engine_bundle.py --target x86_64-pc-windows-msvc --work-root "$temp_root/engine-work" --output "$temp_root/out/binary-engine" --jobs 4
      - name: List the install prefix
        if: always()
        shell: msys2 {0}
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          prefix="$(cygpath -u "$RUNNER_TEMP")/engine-work/prefix"
          ls -la "$prefix/bin" "$prefix/lib" "$prefix/lib/radare2" "$prefix/lib/radare2/plugins" 2>&1 | head -120 || true
          for image in "$prefix"/bin/*.exe "$prefix"/bin/*.dll "$prefix"/lib/*.dll "$prefix"/lib/radare2/plugins/*.dll; do
            [ -e "$image" ] || continue
            extra=$(objdump -p "$image" 2>/dev/null | sed -n 's/.*DLL Name: //p' | grep -viE '^(api-ms-win-|kernel32|advapi32|ws2_32|user32|shell32|ole32|oleaut32|bcrypt|crypt32|psapi|dbghelp|ntdll|libr_)' | tr '\n' ' ')
            [ -n "$extra" ] && echo "$(basename "$image"): $extra"
          done
          grep -n "LDFLAGS" /d/a/_temp/engine-work/sources/radare2/config-user.mk 2>/dev/null || true
          exit 0
      - name: Report the bundle
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'out\binary-engine'
          if (Test-Path $root) {
            Get-ChildItem -Recurse -File $root | Measure-Object -Sum Length | Format-List Count,Sum
            Get-ChildItem -File (Join-Path $root 'radare2\bin') | Format-Table Name,Length
          }
      - name: Decompile with the sidecar's cleared environment
        if: always()
        shell: pwsh
        run: |
          $script = @'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "out" / "binary-engine"
          prefix = root / "radare2"
          toolchain = [p.name for p in root.rglob("*.dll") if p.name.lower().startswith(("libstdc++", "libgcc", "libwinpthread"))]
          if toolchain:
              sys.exit(f"bundle ships toolchain runtime DLLs: {toolchain}")
          home = Path(tempfile.mkdtemp(prefix="r2home-"))
          base = {
              "R2_PREFIX": str(prefix),
              "R2_HOME": str(home),
              "R2_LIBR_PLUGINS": str(prefix / "plugins"),
              "SLEIGHHOME": str(root / "sleigh"),
              "PATH": os.pathsep.join(str(prefix / d) for d in ("bin", "lib", "plugins")),
          }
          sample = r"C:\Windows\System32\cmd.exe"
          for label, env in (("cleared", base), ("cleared+SystemRoot", {**base, "SystemRoot": os.environ["SystemRoot"]})):
              result = subprocess.run(
                  [str(prefix / "bin" / "r2.exe"), "-2", "-q0", "-c", "af @ entry0; pdg @ entry0", sample],
                  env=env, stdin=subprocess.DEVNULL, capture_output=True, timeout=300,
              )
              out = result.stdout.decode(errors="replace").strip("\0").strip()
              print(f"== {label}: exit {result.returncode:#x}, {len(out)} chars")
              print(out[:1500])
              print(result.stderr.decode(errors="replace")[:1500])
              if result.returncode != 0 or "{" not in out:
                  sys.exit(f"{label}: no decompiler output")
          '@
          $file = Join-Path $env:RUNNER_TEMP 'smoke.py'
          Set-Content -Path $file -Value $script
          python $file
